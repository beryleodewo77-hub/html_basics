<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2e7e7;
            margin: 0;
            padding: 20px;
        }

        table {
            width: 70%;
            border: 1px solid #0c0b0b;
            margin: auto;
            border-collapse: collapse;
            /* Ensures that the borders between cells are merged */
        }

        th {
            color: #391f1f;
            background-color: #bd8c8c;
            border: 1px solid #0c0b0b;
            padding: 12px 8px;
            text-align: left;
        }

        td {
            color: #03038b;
            background-color: #f5b19a;
            border: 1px solid #464044;
            padding: 8px 6px;
            text-align: left;
        }

        .salary {
            color: #814b34;
            font-weight: bold;
        }

        /* css frameworks ---bootstrap */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>City</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>John</td>
                <td>Ali</td>
                <td>30</td>
                <td>Mombasa</td>
                <td class="salary">50,000</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>Atieno</td>
                <td>25</td>
                <td>Kisumu</td>
                <td class="salary">60,000</td>
            </tr>
            <tr>
                <td>Michael</td>
                <td>Musyoka</td>
                <td>35</td>
                <td>Nakuru</td>
                <td class="salary">70,000</td>
            </tr>
            <tr>
                <td>Emily</td>
                <td>Nyanchama</td>
                <td>28</td>
                <td>Eldoret</td>
                <td class="salary">55,000</td>
            </tr>
            <tr>
                <td>David</td>
                <td>Brown</td>
                <td>32</td>
                <td>Nairobi</td>
                <td class="salary">65,000</td>
            </tr>
        </tbody>

    </table>

    <!-- list elements unordered list: no numbering  then for ordered list the <ol> tag is used  and is  numbered-->
    <ul>
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Mombasa</li>
        <li>Nakuru</li>
        <li>Eldoret</li>
    </ul>

</body>

</html>
