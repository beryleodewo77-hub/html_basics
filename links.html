<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hyperlinks or Anchor tags</title>
</head>

<body>
    <!-- Hyperlink example just press a for this. -->
    <a href="index.html">Visit our homepage</a>
    <a href="forms.html">Visit our forms page</a>
    <a href="divs.html">Visit our divs page</a>
    <a href="tables.html">Visit our tables page</a>

    <!-- External link example -->

    <a href="https://nation.africa/kenya" target="_blank">Nation Africa</a>

    <!-- linking to external websites within the same tab -->


    <a href="https://www.instagram.com" target="_blank">

        <img src="images/image.png" alt="instagram logo" width="60" height="60">
    </a>


</body>

</html>
